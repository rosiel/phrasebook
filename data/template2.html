    <script>
        const controllers = document.querySelectorAll(".audio-controller");
        function togglePlay(event) {
            audio_id = 'audio-' + event.target.id.replace('controller-', '');
            audio = document.getElementById(audio_id);
            if (audio.paused) {
                audio.play();
            } else {
                audio.pause();
            }
        }
        for (const controller of controllers) {
            controller.addEventListener('click', togglePlay);
        }
    </script>
    </body>
