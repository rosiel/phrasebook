<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HSK1 Flashcards</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!--
    Hidden command input.
    Always focused. Captures all single-key presses.
    Present in the accessibility tree so the braille display cursor has a home.
  -->
  <input type="text"
         id="cmd-input"
         autofocus
         aria-label="Flashcard command input. Press H for help. J for correct. F for wrong. N for next card.">

  <main>
    <!-- Direction label: "Chinese → English" etc -->
    <div id="direction-label" aria-live="polite"></div>

    <!-- The question word — large and centered -->
    <div id="question-word" class="headword" role="heading" aria-level="1"></div>

    <!-- Answer reveal area -->
    <div id="answer-area" hidden>
      <div id="answer-word"></div>
      <div id="pinyin-display"></div>
    </div>

    <!-- Feedback: "Correct!" / "Wrong — it was..." -->
    <div id="feedback" role="alert"></div>
  </main>

  <footer>
    <div id="pool-stats"></div>
    <div id="hint-line">Press <kbd>H</kbd> for help</div>
  </footer>

  <!-- Screen-reader announcement region -->
  <div id="sr-announce" class="sr-only" aria-live="polite" role="status"></div>

  <!-- Help overlay (hidden) -->
  <div id="help-overlay" hidden role="dialog" aria-label="Keyboard shortcuts and stats" aria-modal="true">
    <div id="help-content">
      <h2>Keyboard Shortcuts</h2>
      <table>
        <tr><td><kbd>J</kbd></td><td>Correct — I knew it</td></tr>
        <tr><td><kbd>F</kbd></td><td>Wrong — I didn't know it</td></tr>
        <tr><td><kbd>N</kbd> / <kbd>Space</kbd></td><td>Next card (skip)</td></tr>
        <tr><td><kbd>R</kbd></td><td>Reveal answer</td></tr>
        <tr><td><kbd>D</kbd></td><td>Toggle direction (CN→EN / EN→CN / Mixed)</td></tr>
        <tr><td><kbd>S</kbd></td><td>Re-announce current card</td></tr>
        <tr><td><kbd>H</kbd> / <kbd>?</kbd></td><td>Show/hide this help</td></tr>
        <tr><td><kbd>Escape</kbd></td><td>Close help</td></tr>
      </table>

      <div id="help-stats-section">
        <h2>Your Progress</h2>
        <div id="help-stats"></div>
      </div>

      <button id="help-reset" type="button">Reset All Progress</button>

      <div class="close-hint">Press <kbd>Escape</kbd> or <kbd>H</kbd> to close</div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
